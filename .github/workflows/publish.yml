name: Publish Package

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Build & Pack
        run: |
          pushd packages/client
          npm install
          popd

          pushd packages/server
          npm install && npm run build
          cp ../../README.md ./
          npm pack
          mkdir tar
          cp ./cuteribs-agent-session-viewer-* tar/
          popd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cuteribs-agent-session-viewer
          path: packages/server/tar/

      - name: Publish
        run: |
          cd packages/server/tar
          npm publish *.tgz
