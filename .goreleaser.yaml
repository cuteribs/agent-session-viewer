# GoReleaser v2 — Go backend release configuration
# Docs: https://goreleaser.com
#
# Tag convention: server-go/vMAJOR.MINOR.PATCH  (e.g. server-go/v1.0.0)
# GoReleaser strips the "server-go/" prefix to produce the semantic version.

version: 2

project_name: agent-session-viewer

# ---------------------------------------------------------------------------
# Monorepo support — Go source lives in server-go/
# ---------------------------------------------------------------------------
monorepo:
  tag_prefix: "server-go/"
  dir: server-go

# ---------------------------------------------------------------------------
# Cross-compilation targets
# ---------------------------------------------------------------------------
builds:
  - id: server-go
    main: .
    binary: agent-session-viewer
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # No Windows arm64 binaries
      - goos: windows
        goarch: arm64

# ---------------------------------------------------------------------------
# Archives (tar.gz on Unix, zip on Windows)
# ---------------------------------------------------------------------------
archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - .env.example

# ---------------------------------------------------------------------------
# Checksum
# ---------------------------------------------------------------------------
checksum:
  name_template: checksums.txt
  algorithm: sha256

# ---------------------------------------------------------------------------
# Changelog — filtered to commits touching server-go/
# ---------------------------------------------------------------------------
changelog:
  sort: asc
  use: git
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\(.+\))??!?:.+$'
      order: 2
    - title: Other changes
      order: 999

# ---------------------------------------------------------------------------
# GitHub Release
# ---------------------------------------------------------------------------
release:
  name_template: "Go Server v{{.Version}}"
  header: |
    ## Agent Session Viewer — Go Backend v{{.Version}}

    Standalone server binary. Drop-in replacement for the Node.js backend — **no Node.js required**.

    ### Quick start (binary)

    Download the archive for your platform, extract it, and run:

    ```sh
    ./agent-session-viewer            # Linux / macOS
    agent-session-viewer.exe          # Windows
    ```

    The server starts at `http://localhost:3000` by default.
    Copy `.env.example` → `.env` to customise paths and options.

    ### Quick start (Docker)

    ```sh
    docker run -p 3000:3000 \
      -v ~/.claude:/root/.claude:ro \
      -v ~/.copilot:/root/.copilot:ro \
      -v ~/.codex:/root/.codex:ro \
      -v ~/.local/share/opencode:/root/.local/share/opencode:ro \
      ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/agent-session-viewer:v{{.Version}}
    ```
  footer: |
    **Full changelog**: https://github.com/{{ .Env.GITHUB_REPOSITORY }}/compare/{{ .PreviousTag }}...server-go/v{{.Version}}
